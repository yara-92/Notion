<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>办公楼标准层平面图</title>
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:light-dark(#eceae4,#14171c);--panel:light-dark(#fbfaf7,#1c2027);--ink:light-dark(#1d2733,#e6e8eb);--mute:light-dark(#667085,#98a2b3);--line:light-dark(#d5d1c6,#343b46);
--wall:light-dark(#2f3a4a,#cfd6e0);--floor:light-dark(#f6f2e7,#222831);--accent:light-dark(#0b6bcb,#5aa9ff);--window:light-dark(#6cc0ee,#3b82b8);--grid:light-dark(#a9b0bb,#576170);
--furn:light-dark(#fff,#2d3541);--furn-s:light-dark(#8e98a8,#667286);--col:light-dark(#1f2937,#e5e7eb);--halo:light-dark(rgba(255,255,255,.8),rgba(20,23,28,.75));
--open:light-dark(#d6e7f7,#263a50);--private:light-dark(#e4dcf8,#372f50);--meeting:light-dark(#fbe3c0,#4e3e25);--wc:light-dark(#c6ebe1,#1e4a40);
--equip:light-dark(#d9dde3,#343a45);--core:light-dark(#f3d3d3,#573030);--hall:light-dark(#fbe9e9,#46292b);--pub:light-dark(#fff0b0,#4c4525)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:14px 16px}
h1{font-size:19px;margin:0;letter-spacing:.04em}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tools label{display:flex;gap:4px;align-items:center;cursor:pointer}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:0 16px 16px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:min(78vh,780px);min-height:340px}
svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}svg:active{cursor:grabbing}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
h2{font-size:16px;margin:0 0 6px}dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0}dt{color:var(--mute)}dd{margin:0}
.mute{color:var(--mute);margin:4px 0}
.chips{display:grid;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:8px;text-align:left;width:100%}.chip i{width:14px;height:14px;border:1px solid var(--wall);border-radius:3px;flex:none}
.chip small{margin-left:auto;color:var(--mute)}.chip[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#plan>*{pointer-events:none}#plan>#rooms{pointer-events:auto}
.fl{fill:var(--floor)}.cb{fill:var(--core);stroke:var(--wall);stroke-width:3}
.room{cursor:pointer;outline:none;transition:opacity .2s}.room>rect{stroke:var(--wall);stroke-width:1.6}
.t-open>rect{fill:var(--open)}.t-private>rect{fill:var(--private)}.t-meeting>rect{fill:var(--meeting)}.t-wc>rect{fill:var(--wc)}
.t-equip>rect{fill:var(--equip)}.t-core>rect{fill:var(--core)}.t-pub>rect{fill:var(--pub)}.t-core.car>rect{fill:var(--furn)}.t-core.hall>rect{fill:var(--hall)}
.room:hover>rect,.room:focus-visible>rect{stroke:var(--accent);stroke-width:3}.room.sel>rect{stroke:var(--accent);stroke-width:4}.room.dim{opacity:.2}
.fn{fill:var(--furn);stroke:var(--furn-s);stroke-width:1}.st{stroke:var(--furn-s);stroke-width:1;fill:none}.hl{stroke:var(--furn-s);stroke-width:1;opacity:.6}
.gap{stroke:var(--floor);stroke-width:5;fill:none}.dr{stroke:var(--wall);stroke-width:1;fill:none}
.ow{fill:none;stroke:var(--wall);stroke-width:12}.win{fill:none;stroke:var(--window);stroke-width:5;stroke-dasharray:44 14}
.col{fill:var(--col)}.gl{stroke:var(--grid);stroke-width:.7;stroke-dasharray:7 4}.gb{fill:var(--panel);stroke:var(--grid)}
.lbl{font:600 12px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}
.sub{font-size:9.5px;font-weight:400;fill:var(--mute)}.sm{font-size:9px}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header>
  <h1>办公楼标准层平面图</h1>
  <div class="tools">
    <label><input type="checkbox" data-layer="L-grid" checked>轴网</label>
    <label><input type="checkbox" data-layer="L-col" checked>柱子</label>
    <label><input type="checkbox" data-layer="L-fn" checked>家具</label>
    <label><input type="checkbox" data-layer="L-lbl" checked>标注</label>
    <button id="zi" aria-label="放大">＋</button><button id="zo" aria-label="缩小">－</button><button id="zr">复位</button><button id="th">明暗切换</button>
  </div>
</header>
<main>
  <div class="stage">
    <svg id="plan" viewBox="0 0 1000 700" role="img" aria-label="办公楼标准层平面图" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hl" x1="0" y1="0" x2="0" y2="8"/></pattern></defs>
    </svg>
  </div>
  <aside>
    <section class="card" id="info"></section>
    <section class="card"><h2>空间类型</h2><p class="mute">点击类型可聚焦，再点一次取消。</p><div class="chips" id="legend"></div></section>
  </aside>
</main>
<script>
const $=s=>document.querySelector(s),svg=$('#plan'),root=document.documentElement;
const T={open:'开放办公区',private:'独立办公室',meeting:'会议室',wc:'卫生间',equip:'设备用房',core:'交通核心筒',pub:'公共服务'};
// 1 单位 = 0.1 m；楼层净面积 87.6 m × 57.6 m
let R=[
['N-01','开放办公区 A','open',62,62,298,138,'s','北向采光的开放办公区，工位采用 1.4 m 标准模块。'],
['N-02','会议室 1','meeting',360,62,140,138,'s','中型会议室，配备投影与白板。'],
['N-03','会议室 2','meeting',500,62,140,138,'s','中型会议室，可与会议室 1 联合使用。'],
['N-04','开放办公区 B','open',640,62,298,138,'s','北向采光的开放办公区。'],
['W-01','经理室 1','private',62,240,108,73,'e','独立办公室，临开放办公区。'],
['W-02','经理室 2','private',62,313,108,74,'e','独立办公室。'],
['W-03','经理室 3','private',62,387,108,73,'e','独立办公室。'],
['W-04','开放办公区 C','open',170,240,190,220,'e','西侧开放办公区，紧邻走廊。'],
['E-01','男卫生间','wc',640,240,100,110,'w','含 4 个蹲位及洗手台。'],
['E-02','女卫生间','wc',640,350,100,110,'w','含 4 个蹲位及洗手台。'],
['E-03','配电间','equip',740,240,100,130,'n','楼层强电配电，禁止无关人员进入。'],
['E-04','弱电间','equip',840,240,98,130,'n','综合布线与弱电设备。'],
['E-05','空调机房','equip',740,370,198,90,'s','新风机组与空调末端设备。'],
['S-01','楼梯间 A','core',62,500,108,138,'n','封闭疏散楼梯，西南角。'],
['S-02','茶水间','pub',170,500,190,138,'n','员工休息与简餐区。'],
['S-03','前台大堂','pub',360,500,280,138,'n','主入口，设前台与等候区。'],
['S-04','IT 机房','equip',640,500,190,138,'n','服务器与网络核心设备。'],
['S-05','楼梯间 B','core',830,500,108,138,'n','封闭疏散楼梯，东南角。'],
['C-00','电梯厅','core',400,296,200,108,null,'核心筒中部的候梯空间，东西两侧通向走廊。'],
['C-W','管道井','equip',406,300,22,26,null,'电气与给排水竖向管井。'],
['C-E','管道井','equip',572,376,22,26,null,'电气与给排水竖向管井。']
];
for(let i=0;i<8;i++){const n=i<4;R.push(['E'+(i+1),i==6?'货梯 E7':i==7?'消防梯 E8':'客梯 E'+(i+1),'core',408+(i%4)*46,n?246:406,40,48,null,
 i==6?'载重 3000 kg，兼作货运。':i==7?'消防电梯，前室设防火门。':'载重 1350 kg，额定 18 人。']);}
R=R.map(([id,name,type,x,y,w,h,door,desc])=>({id,name,type,x,y,w,h,door,desc,area:Math.round(w*h/100),car:/^E\d/.test(id)}));
const xs=[110,250,400,600,750,890],ys=[100,240,460,600],cols=[];xs.forEach(x=>ys.forEach(y=>cols.push([x,y])));
const hit=(x,y,w,h)=>cols.some(([a,b])=>a+9>x&&a-9<x+w&&b+9>y&&b-9<y+h);
function desks(r){let o='',n=0;const cx=r.x+r.w/2,cy=r.y+r.h/2;
 for(let y=r.y+16;y+36<=r.y+r.h-8;y+=40)for(let x=r.x+16;x+30<=r.x+r.w-10;x+=44){
  if(hit(x-3,y-3,36,40)||(x+30>cx-48&&x<cx+48&&y+36>cy-14&&y<cy+14))continue;n++;
  o+=`<rect class="fn" x="${x}" y="${y}" width="30" height="14" rx="2"/><circle class="fn" cx="${x+15}" cy="${y+22}" r="5"/>`}
 r.cap=n;return o}
function meet(r){const cx=r.x+r.w/2,cy=r.y+r.h/2+8,tw=r.w-56,n=Math.floor(tw/24);let o=`<rect class="fn" x="${cx-tw/2}" y="${cy-18}" width="${tw}" height="36" rx="8"/>`;
 for(let i=0;i<n;i++){const x=cx-tw/2+tw/n*(i+.5);o+=`<circle class="fn" cx="${x}" cy="${cy-26}" r="5"/><circle class="fn" cx="${x}" cy="${cy+26}" r="5"/>`}
 r.cap=n*2;return o}
function door(r){if(!r.door)return'';const W=28,s=r.door;let hx,hy,ux,uy,nx,ny;
 if(s=='s'){hx=r.x+r.w/2-14;hy=r.y+r.h;ux=1;uy=0;nx=0;ny=-1}else if(s=='n'){hx=r.x+r.w/2-14;hy=r.y;ux=1;uy=0;nx=0;ny=1}
 else if(s=='e'){hx=r.x+r.w;hy=r.y+r.h/2-14;ux=0;uy=1;nx=-1;ny=0}else{hx=r.x;hy=r.y+r.h/2-14;ux=0;uy=1;nx=1;ny=0}
 const sw=(nx*uy-ny*ux)>0?1:0;
 return `<path class="gap" d="M${hx} ${hy}L${hx+ux*W} ${hy+uy*W}"/><path class="dr" d="M${hx} ${hy}L${hx+nx*W} ${hy+ny*W}A${W} ${W} 0 0 ${sw} ${hx+ux*W} ${hy+uy*W}"/>`}
let base=`<rect class="fl" x="62" y="62" width="876" height="576"/><rect class="cb" x="400" y="240" width="200" height="220"/>`,
 grid='',rooms='',fn='',dr='',lbl='';
xs.forEach((x,i)=>{grid+=`<path class="gl" d="M${x} 38V662"/><circle class="gb" cx="${x}" cy="26" r="11"/><text class="lbl sub" style="stroke:none;font-size:11px" x="${x}" y="30">${i+1}</text>`});
ys.forEach((y,i)=>{grid+=`<path class="gl" d="M38 ${y}H962"/><circle class="gb" cx="26" cy="${y}" r="11"/><text class="lbl sub" style="stroke:none;font-size:11px" x="26" y="${y+4}">${'ABCD'[i]}</text>`});
R.forEach(r=>{const cls=`room t-${r.type}${r.car?' car':''}${r.id=='C-00'?' hall':''}`;
 rooms+=`<g class="${cls}" data-id="${r.id}" tabindex="0" role="button" aria-label="${r.name}"><title>${r.name}</title><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/></g>`;
 dr+=door(r);const cx=r.x+r.w/2,cy=r.y+r.h/2;
 if(r.type=='open')fn+=desks(r);
 if(r.type=='meeting')fn+=meet(r);
 if(r.type=='private')fn+=`<rect class="fn" x="${r.x+16}" y="${r.y+r.h-30}" width="42" height="13" rx="2"/><circle class="fn" cx="${r.x+37}" cy="${r.y+r.h-10}" r="5"/>`;
 if(r.type=='wc'){for(let y=r.y+8;y+18<=r.y+r.h-6;y+=21)fn+=`<rect class="fn" x="${r.x+r.w-26}" y="${y}" width="18" height="18" rx="2"/><circle class="fn" cx="${r.x+r.w-17}" cy="${y+9}" r="4"/>`;
  fn+=`<circle class="fn" cx="${r.x+16}" cy="${r.y+20}" r="7"/><circle class="fn" cx="${r.x+16}" cy="${r.y+r.h-20}" r="7"/>`}
 if(r.type=='equip'&&r.w>30)fn+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="url(#hatch)"/>`;
 if(r.name.startsWith('楼梯')){for(let y=r.y+14;y<r.y+r.h-12;y+=8)fn+=`<path class="st" d="M${r.x+12} ${y}H${cx-3}M${cx+3} ${y}H${r.x+r.w-12}"/>`;fn+=`<path class="st" d="M${cx} ${r.y+14}V${r.y+r.h-12}"/>`}
 if(r.id=='S-02')fn+=`<rect class="fn" x="${r.x+14}" y="${r.y+r.h-28}" width="${r.w-28}" height="14"/>`+[50,r.w/2,r.w-50].map(d=>`<circle class="fn" cx="${r.x+d}" cy="${r.y+r.h-62}" r="11"/>`).join('');
 if(r.id=='S-03')fn+=`<rect class="fn" x="440" y="575" width="120" height="22" rx="4"/><rect class="fn" x="376" y="560" width="54" height="22" rx="5"/><rect class="fn" x="570" y="560" width="54" height="22" rx="5"/><circle class="fn" cx="385" cy="620" r="9"/><circle class="fn" cx="615" cy="620" r="9"/>`;
 if(r.car)fn+=`<path class="st" d="M${r.x} ${r.y}L${r.x+r.w} ${r.y+r.h}M${r.x+r.w} ${r.y}L${r.x} ${r.y+r.h}"/>`;
 if(r.id=='C-W'||r.id=='C-E')return;
 let ly=cy-2;if(r.type=='meeting'||r.type=='private')ly=r.y+22;if(r.type=='pub')ly=r.id=='S-03'?552:r.y+34;
 if(r.car)lbl+=`<text class="lbl sm" x="${cx}" y="${cy+3}">E${r.id.slice(1)}</text>`;
 else lbl+=`<text class="lbl" x="${cx}" y="${ly}">${r.name}</text><text class="lbl sub" x="${cx}" y="${ly+13}">${r.area} m²</text>`});
lbl+=`<text class="lbl sub" x="230" y="224">公共走廊</text><text class="lbl sub" x="770" y="224">公共走廊</text><text class="lbl sub" x="230" y="484">公共走廊</text><text class="lbl sub" x="770" y="484">公共走廊</text><text class="lbl" x="500" y="678">▲ 主入口</text>`;
const gaps=`<path class="gap" d="M400 336V364M600 336V364"/><path class="gap" style="stroke-width:14" d="M465 644H535"/>`;
const deco=`<rect class="ow" x="56" y="56" width="888" height="588"/><rect class="win" x="56" y="56" width="888" height="588"/>`+
 `<path class="dr" style="stroke-width:1.5" d="M840 680H940M840 674V686M940 674V686"/><text class="lbl sub" x="890" y="670">10 m</text><path class="fn" d="M972 70l-9 24 9-6 9 6z"/><text class="lbl" x="972" y="62">N</text>`;
svg.insertAdjacentHTML('beforeend',base+`<g id="L-grid">${grid}</g><g id="rooms">${rooms}</g><g id="L-fn">${fn}</g><g>${dr}${gaps}</g>${deco}`+
 `<g id="L-col">${cols.map(([x,y])=>`<rect class="col" x="${x-7}" y="${y-7}" width="14" height="14"/>`).join('')}</g><g id="L-lbl">${lbl}</g>`);
// 信息面板与图例
const info=$('#info'),sum={};let sel=null,filt=null;
R.forEach(r=>{const s=sum[r.type]??=[0,0];s[0]++;s[1]+=r.area});
const show=r=>{info.innerHTML=r?`<h2>${r.name}</h2><dl><dt>编号</dt><dd>${r.id}</dd><dt>类型</dt><dd>${T[r.type]}</dd><dt>面积</dt><dd>${r.area} m²</dd><dt>尺寸</dt><dd>${(r.w/10).toFixed(1)} × ${(r.h/10).toFixed(1)} m</dd>${r.cap?`<dt>容纳</dt><dd>约 ${r.cap} 人</dd>`:''}</dl><p class="mute">${r.desc}</p>`
 :`<h2>标准层总览</h2><dl><dt>轴网</dt><dd>1–6 × A–D</dd><dt>外轮廓</dt><dd>87.6 × 57.6 m</dd><dt>建筑面积</dt><dd>约 ${Math.round(876*576/100)} m²</dd></dl><p class="mute">点击任意空间查看详情，滚轮缩放，拖动平移。</p>`};
function select(r){document.querySelectorAll('.room.sel').forEach(n=>n.classList.remove('sel'));sel=r;
 if(r){const n=$(`.room[data-id="${r.id}"]`);n.classList.add('sel');n.parentNode.appendChild(n)}show(r)}
$('#legend').innerHTML=Object.keys(T).map(t=>`<button class="chip" aria-pressed="false" data-t="${t}"><i style="background:var(--${t})"></i>${T[t]}<small>${sum[t][0]} 间 · ${sum[t][1]} m²</small></button>`).join('');
$('#legend').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filt=filt==b.dataset.t?null:b.dataset.t;
 document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t==filt));
 document.querySelectorAll('.room').forEach(n=>n.classList.toggle('dim',!!filt&&!n.classList.contains('t-'+filt)))};
// 缩放与平移
let vb=[0,0,1000,700],drag=null,moved=0;const setVB=()=>svg.setAttribute('viewBox',vb.join(' '));
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
function zoom(k,p){p=p||{x:vb[0]+vb[2]/2,y:vb[1]+vb[3]/2};const w=Math.min(1000,Math.max(220,vb[2]*k)),q=w/vb[2];vb=[p.x-(p.x-vb[0])*q,p.y-(p.y-vb[1])*q,w,vb[3]*q];setVB()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:1/1.12,pt(e))},{passive:false});
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vb:[...vb]};moved=0});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
 if(moved<5)return;const s=1/svg.getScreenCTM().a;vb=[drag.vb[0]-dx*s,drag.vb[1]-dy*s,vb[2],vb[3]];setVB()});
addEventListener('pointerup',()=>drag=null);
svg.addEventListener('click',e=>{if(moved>=5)return;const g=e.target.closest('.room');select(g?R.find(r=>r.id==g.dataset.id):null)});
svg.addEventListener('keydown',e=>{if(e.key=='Enter'){const g=e.target.closest('.room');g&&select(R.find(r=>r.id==g.dataset.id))}});
$('#zi').onclick=()=>zoom(1/1.3);$('#zo').onclick=()=>zoom(1.3);$('#zr').onclick=()=>{vb=[0,0,1000,700];setVB()};
document.querySelectorAll('[data-layer]').forEach(c=>c.onchange=()=>$('#'+c.dataset.layer).style.display=c.checked?'':'none');
$('#th').onclick=()=>{const d=root.dataset.theme?root.dataset.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=d?'light':'dark'};
show(null);
</script>
</body>
</html>
